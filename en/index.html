<!--

	function setColor2() {

	function setColor3() {
		document.getElementById('top').style.borderTop = '5px solid black';

		for (i = 0; i < emList.length; i++) {

	// --- JavaScript Port: Diff Compare and Word Count Logic ---
	function escapeChar(string) {
		if (!string) return '';
		return string
			.replace(/&/g, '&amp;')
			.replace(/</g, '&lt;')
			.replace(/>/g, '&gt;')
			.replace(/'/g, '&#39;')
			.replace(/"/g, '&quot;');
	}

	function escapeSpace(string) {
		if (!string) return '';
		return string.replace(/ {2,}/g, m => '&nbsp;'.repeat(m.length)).replace(/\t/g, '&nbsp;&nbsp;&nbsp;&nbsp;');
	}

	function splitText(text) {
		if (!text) return [];
		// Standardize line breaks
		text = text.replace(/\r\n/g, '\n').replace(/\r/g, '\n');
		// Convert original line breaks to <$>
		text = text.replace(/\n/g, '<$>');
		
		const tokens = [];
		let temp = text;
		// Words (alphanumeric sequences), line break placeholders, HTML entities, or any other single character
		const regex = /^([a-zA-Z0-9]+|<\$>|&#?\w+;|[\s\S])/;
		while (temp.length > 0) {
			const match = temp.match(regex);
			if (match) {
				tokens.push(match[1]);
				temp = temp.substring(match[1].length);
			} else {
				tokens.push(temp[0]);
				temp = temp.substring(1);
			}
		}
		return tokens;
	}

	function countChar(text) {
		if (!text) return [0, 0, 0, 0];
		
		// Word count
		const wordsMatch = text.match(/\s*\S+/g);
		const wcount = wordsMatch ? wordsMatch.length : 0;
		
		// Remove CR for character counts
		const cleanText = text.replace(/\r/g, '');
		const count3 = cleanText.length; // Including newlines & spaces
		
		const noNewline = cleanText.replace(/\n/g, '');
		const count2 = noNewline.length; // Excluding newlines, including spaces
		
		const noSpace = noNewline.replace(/\s/g, '');
		const count1 = noSpace.length; // Excluding both newlines & spaces
		
		return [count1, count2, count3, wcount];
	}

	function diffLCS(A, B) {
		const N = A.length;
		const M = B.length;
		
		// Build LCS DP Table
		const dp = Array.from({ length: N + 1 }, () => new Int32Array(M + 1));
		
		for (let i = 1; i <= N; i++) {
			for (let j = 1; j <= M; j++) {
				if (A[i - 1] === B[j - 1]) {
					dp[i][j] = dp[i - 1][j - 1] + 1;
				} else {
					dp[i][j] = Math.max(dp[i - 1][j], dp[i][j - 1]);
				}
			}
		}
		
		// Backtrack path
		let i = N, j = M;
		const aEm = new Uint8Array(N);
		const bEm = new Uint8Array(M);
		
		while (i > 0 || j > 0) {
			if (i > 0 && j > 0 && A[i - 1] === B[j - 1]) {
				i--;
				j--;
			} else if (j > 0 && (i === 0 || dp[i][j - 1] >= dp[i - 1][j])) {
				bEm[j - 1] = 1;
				j--;
			} else if (i > 0 && (j === 0 || dp[i][j - 1] < dp[i - 1][j])) {
				aEm[i - 1] = 1;
				i--;
			}
		}
		
		const aResult = [...A];
		const bResult = [...B];
		
		// Highlight deletions (A)
		let inEm = false;
		for (let k = 0; k < N; k++) {
			if (aEm[k] === 1) {
				if (!inEm) {
					aResult[k] = '<em>' + aResult[k];
					inEm = true;
				}
				if (k === N - 1 || aEm[k + 1] === 0) {
					aResult[k] = aResult[k] + '</em>';
					inEm = false;
				}
			}
		}
		
		// Highlight additions (B)
		inEm = false;
		for (let k = 0; k < M; k++) {
			if (bEm[k] === 1) {
				if (!inEm) {
					bResult[k] = '<em>' + bResult[k];
					inEm = true;
				}
				if (k === M - 1 || bEm[k + 1] === 0) {
					bResult[k] = bResult[k] + '</em>';
					inEm = false;
				}
			}
		}
		
		return [aResult, bResult];
	}

	function compareAndRender() {
		const seqA = document.difff.sequenceA.value;
		const seqB = document.difff.sequenceB.value;
		
		// HTML Escape
		const escA = escapeChar(seqA);
		const escB = escapeChar(seqB);
		
		// Tokenize
		const tokensA = splitText(escA);
		const tokensB = splitText(escB);
		
		// Calculate Diff
		const [resA, resB] = diffLCS(tokensA, tokensB);
		
		let aFinalStr = resA.join('');
		let bFinalStr = resB.join('');
		
		// Adjust <em> tags crossing <td> (line breaks <$>)
		const emCrossRegex = /(<em>[^<>]*)<\$>((?:[^<>]|<\$>)*<\/em>)/g;
		while (emCrossRegex.test(aFinalStr)) {
			aFinalStr = aFinalStr.replace(emCrossRegex, '$1</i><$><em>$2');
		}
		while (emCrossRegex.test(bFinalStr)) {
			bFinalStr = bFinalStr.replace(emCrossRegex, '$1</i><$><em>$2');
		}
		
		// Split by <$> to get line array
		const aFinalLines = aFinalStr.split('<$>');
		const bFinalLines = bFinalStr.split('<$>');
		
		const maxLines = Math.max(aFinalLines.length, bFinalLines.length);
		let tableContent = '';
		
		for (let idx = 0; idx < maxLines; idx++) {
			let aLine = aFinalLines[idx] !== undefined ? aFinalLines[idx] : '';
			let bLine = bFinalLines[idx] !== undefined ? bFinalLines[idx] : '';
			
			// Escape spaces and tabs
			aLine = escapeSpace(aLine);
			bLine = escapeSpace(bLine);
			
			tableContent += `<tr>\n\t<td>${aLine}</td>\n\t<td>${bLine}</td>\n</tr>\n`;
		}
		
		// Word and Character Counts
		const countsA = countChar(seqA);
		const countsB = countChar(seqB);
		
		tableContent += `
<tr>
\t<td><font color=gray>
\t\t${countsA[3]} words<br>
\t\t${countsA[0]} chars<br>
\t\t${countsA[1] - countsA[0]} spaces (sum: ${countsA[1]} chars)<br>
\t\t${countsA[2] - countsA[1]} linefeeds (sum: ${countsA[2]} chars)
\t</font></td>
\t<td><font color=gray>
\t\t${countsB[3]} words<br>
\t\t${countsB[0]} chars<br>
\t\t${countsB[1] - countsB[0]} spaces (sum: ${countsB[1]} chars)<br>
\t\t${countsB[2] - countsB[1]} linefeeds (sum: ${countsB[2]} chars)
\t</font></td>
</tr>
`;

		const resultArea = document.getElementById('result-area');
		resultArea.innerHTML = `
<div id=result>
<table cellspacing=0>
${tableContent}</table>

<p>
\t<input type=button id=hide value='Hide form (print friendly)' onclick='hideForm()'> |
\t<input type=radio name=color value=1 onclick='setColor1()' checked>
\t\t<span class=blue >Color 1</span>
\t<input type=radio name=color value=2 onclick='setColor2()'>
\t\t<span class=green>Color 2</span>
\t<input type=radio name=color value=3 onclick='setColor3()'>
\t\t<span class=black>Monochrome</span>
</p>
</div>
`;
		
		// Smooth scroll to the result
		resultArea.scrollIntoView({ behavior: 'smooth' });
	}
//-->
</script>
